; M5Stack Cardputer-Adv + Cap LoRa-1262, ported from MeshCore-Cardputer-ADV.
; Headless Bitchat bridge: MeshCore companion over USB serial, Bitchat owns BLE.
[m5stack_cardputer_adv_base]
extends = esp32_base
board = m5stack_cardputer
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/m5stack_cardputer_adv
  -D M5STACK_CARDPUTER
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D PIN_USER_BTN=0
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_NSS=5
  -D P_LORA_DIO_1=4
  -D P_LORA_RESET=3
  -D P_LORA_BUSY=6
  -D P_LORA_MOSI=14
  -D P_LORA_MISO=39
  -D P_LORA_SCLK=40
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_CURRENT_LIMIT=240
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=3.3
  -D PIN_BOARD_SDA=2
  -D PIN_BOARD_SCL=1
  -D PIN_VBAT_READ=10
  ; US preset (MeshCore "USA/Canada"); only used when no saved prefs exist
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/m5stack_cardputer_adv>
lib_deps =
  ${esp32_base.lib_deps}
  M5Cardputer=https://github.com/m5stack/M5Cardputer.git#1.2.0

[env:M5stack_cardputer_adv_companion_radio_usb_bitchat]
extends = m5stack_cardputer_adv_base
build_flags =
  ${m5stack_cardputer_adv_base.build_flags}
  ${bitchat_base.build_flags}
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=40
  -D BITCHAT_DEBUG=1
build_src_filter = ${m5stack_cardputer_adv_base.build_src_filter}
  ${bitchat_base.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${m5stack_cardputer_adv_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
